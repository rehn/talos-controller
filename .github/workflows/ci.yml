name: CI/CD

# Every push to main: test → create a release (vX.Y.Z from Conventional Commits)
# → build and push a multi-arch image tagged with that version.
# Pull requests: test and build the image without pushing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release half-way on main; PR runs may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Resolve modules
        run: |
          if [ ! -f go.sum ]; then
            echo "::warning::backend/go.sum is not committed; running go mod tidy"
            go mod tidy
          fi
          go mod download

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::Files need gofmt:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          else
            echo "::warning::frontend/package-lock.json is not committed; using npm install"
            npm install --no-audit --no-fund
          fi

      - name: Unit tests
        run: npm test

      - name: Type check + static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  scripts:
    name: Release script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/next-version_test.sh

  release:
    name: Release
    needs: [backend, frontend, scripts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags to find the previous release

      - name: Next version
        id: next
        run: |
          v=$(scripts/next-version.sh)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ -n "$v" ]; then
            echo "Next release: $v" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release (no new commits or [skip release])" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create GitHub release
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes

  docker:
    name: Docker image
    needs: [backend, frontend, scripts, release]
    # Run on PRs (release is skipped there) and after a successful release job on main.
    if: >-
      always() &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.scripts.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      # Set the repository variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN.
      IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/talos-controller
      PUSH: ${{ github.event_name != 'pull_request' }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check Docker Hub settings
        if: env.PUSH == 'true'
        env:
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$HUB_USER" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Set the repository variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      # The Dockerfile cross-compiles on the build platform and the final stage has
      # no RUN steps, so no QEMU emulation is needed for arm64.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags:
      #   release vX.Y.Z  -> X.Y.Z, X.Y, latest
      #   every main push -> main, sha-abc1234
      #   pull request    -> pr-N (not pushed)
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=raw,value=latest,enable=${{ env.VERSION != '' }}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION || format('sha-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
