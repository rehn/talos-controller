name: CI/CD

# Flow: merge a PR into main, then push a tag vX.Y.Z on the merge commit.
# Pull requests and main: test (PRs also build the image without pushing).
# Tag vX.Y.Z: test -> create the GitHub release -> build and push the multi-arch image.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release half-way; PR runs may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Resolve modules
        run: |
          if [ ! -f go.sum ]; then
            echo "::warning::backend/go.sum is not committed; running go mod tidy"
            go mod tidy
          fi
          go mod download

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::Files need gofmt:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          else
            echo "::warning::frontend/package-lock.json is not committed; using npm install"
            npm install --no-audit --no-fund
          fi

      - name: Unit tests
        run: npm test

      - name: Type check + static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  release:
    name: Release
    needs: [backend, frontend]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to verify the tag is on main

      - name: Check tag
        id: check
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          # Only release commits that are on main (i.e. merged PRs).
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Merge the PR first, then tag the merge commit."
            exit 1
          fi
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes

  docker:
    name: Docker image
    needs: [backend, frontend, release]
    # PRs: build only (release is skipped). Tags: after the release job succeeds, build and push.
    # Plain pushes to main only run the tests.
    if: >-
      always() &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      (github.event_name == 'pull_request' || (github.ref_type == 'tag' && needs.release.result == 'success'))
    runs-on: ubuntu-latest
    env:
      # Set the repository variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN.
      IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/talos-controller
      PUSH: ${{ github.ref_type == 'tag' }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check Docker Hub settings
        if: env.PUSH == 'true'
        env:
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$HUB_USER" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Set the repository variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      # The Dockerfile cross-compiles on the build platform and the final stage has
      # no RUN steps, so no QEMU emulation is needed for arm64.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags:
      #   release vX.Y.Z  -> X.Y.Z, X.Y, latest
      #   pull request    -> pr-N (not pushed)
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=raw,value=latest,enable=${{ env.VERSION != '' }}
            type=ref,event=pr

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION || format('sha-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
